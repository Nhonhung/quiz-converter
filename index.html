<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b14;--card:#111827;--border:#1e2d45;--border2:#2a3f5f;--violet:#7c3aed;--cyan:#06b6d4;--emerald:#10b981;--amber:#f59e0b;--rose:#ef4444;--text:#e8f0fe;--muted:#64748b;--r:14px;--r2:10px;--r3:7px;--font:'Be Vietnam Pro',system-ui,sans-serif;--serif:'Times New Roman',Times,serif}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overflow-x:hidden}
body{-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.glass{background:rgba(13,18,32,.78);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:var(--r2);border:none;cursor:pointer;font-family:var(--font);font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-violet{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.4)}
.btn-violet:hover{transform:translateY(-2px)}
.btn-cyan{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff}
.btn-emerald{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 16px rgba(16,185,129,.4)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--violet);background:rgba(124,58,237,.08)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:var(--r3)}
.btn-xs{padding:4px 8px;font-size:11px;border-radius:5px}
.btn-full{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.inp{width:100%;padding:8px 11px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:13.5px;outline:none}
.inp:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.inp::placeholder{color:var(--muted)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.55}
.lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.header{text-align:center;margin-bottom:16px}
.header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#67e8f9 55%,#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.header p{color:var(--muted);font-size:12.5px;margin-top:3px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;user-select:none;white-space:nowrap}
.tab.active{color:#a78bfa;border-bottom-color:var(--violet)}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:40px 20px;text-align:center;cursor:pointer;background:rgba(255,255,255,.015);display:block;position:relative;transition:.15s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--violet);background:rgba(124,58,237,.08)}
.upload-zone .icon{font-size:44px;margin-bottom:8px}
.upload-zone h3{font-size:15px;font-weight:700;margin-bottom:4px}
.upload-zone p{color:var(--muted);font-size:12px}
.upload-zone input[type=file]{display:none}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.file-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r3);background:rgba(255,255,255,.03);border:1px solid var(--border);font-size:13px}
.file-item .ico{font-size:18px}
.file-item .info{flex:1;min-width:0}
.file-item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .meta{font-size:11px;color:var(--muted)}
.file-item .status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.st-work{background:rgba(6,182,212,.2);color:#67e8f9}
.st-ok{background:rgba(16,185,129,.2);color:#6ee7b7}
.st-err{background:rgba(239,68,68,.2);color:#fca5a5}
.progress{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px;display:none}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .35s}
.section{margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.section-head h2{font-size:17px;font-weight:700}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.stat.mcq{border-color:rgba(124,58,237,.4);color:#c4b5fd;background:rgba(124,58,237,.1)}
.stat.tf{border-color:rgba(6,182,212,.4);color:#67e8f9;background:rgba(6,182,212,.1)}
.stat.tnl{border-color:rgba(245,158,11,.4);color:#fbbf24;background:rgba(245,158,11,.1)}
.stat.tl{border-color:rgba(16,185,129,.4);color:#6ee7b7;background:rgba(16,185,129,.1)}
.stat.err{border-color:rgba(239,68,68,.4);color:#fca5a5;background:rgba(239,68,68,.1)}
.q-list{display:flex;flex-direction:column;gap:10px}
.q-card{padding:12px;border-radius:var(--r2);background:rgba(255,255,255,.025);border:1.5px solid var(--border);transition:.15s}
.q-card:hover{border-color:var(--border2)}
.q-card.flagged{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.04)}
.q-card.error{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.04)}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.q-head-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.q-num{font-weight:700;color:#a78bfa;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.b-mcq{background:rgba(124,58,237,.2);color:#c4b5fd;border:1px solid rgba(124,58,237,.35)}
.b-tf{background:rgba(6,182,212,.2);color:#67e8f9;border:1px solid rgba(6,182,212,.35)}
.b-tnl{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.35)}
.b-tl{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)}
.b-conf{background:rgba(100,116,139,.2);color:#cbd5e1;border:1px solid rgba(100,116,139,.4)}
.b-img{background:rgba(236,72,153,.2);color:#f9a8d4;border:1px solid rgba(236,72,153,.35)}
.rich-text{white-space:pre-wrap;word-break:break-word;font-family:var(--serif);line-height:1.6}
.rich-text strong{font-weight:800;color:#fff}
.rich-text em{font-style:italic;color:#c4b5fd}
.rich-text u{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#67e8f9;text-decoration-thickness:2px}
.rich-text br{display:block;content:'';margin-top:2px}
.rich-text .blank{display:inline-block;padding:0 6px 2px;border-bottom:2px solid #67e8f9;color:#67e8f9;font-family:monospace;letter-spacing:2px;background:rgba(103,232,249,.05)}
.opt-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.opt-row input[type=radio]{accent-color:var(--violet);width:15px;height:15px;flex-shrink:0;cursor:pointer}
.opt-key{min-width:22px;height:22px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.opt-preview{margin-left:29px;padding:4px 8px;border-radius:5px;background:rgba(124,58,237,.05);border:1px dashed rgba(124,58,237,.25);font-family:var(--serif);font-size:12.5px;line-height:1.5;color:#e8f0fe;margin-bottom:4px}
.opt-preview-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);margin-right:5px;opacity:.8}
.sub-q{padding:8px 10px;border-radius:var(--r3);border:1px solid var(--border);background:rgba(6,182,212,.03);margin-bottom:6px}
.sub-q-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.sub-q-num{min-width:20px;font-weight:700;color:#67e8f9;font-size:12px}
.sub-q-ans{display:flex;gap:5px;margin-left:27px;flex-wrap:wrap}
.sub-btn{padding:3px 10px;border-radius:5px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font);border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:.12s}
.sub-btn.on-t{border-color:var(--emerald);background:rgba(16,185,129,.18);color:#6ee7b7}
.sub-btn.on-f{border-color:var(--rose);background:rgba(239,68,68,.18);color:#fca5a5}
.issues{margin-top:6px;padding:7px 10px;border-radius:var(--r3);font-size:11.5px;line-height:1.5}
.issues.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);color:#fca5a5}
.issues.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);color:#fbbf24}
.thumb{max-width:110px;max-height:80px;object-fit:contain;border-radius:5px;border:1px solid var(--border);cursor:zoom-in;display:block;margin-top:5px;background:#0a0e1a}
.q-original{padding:8px;border-radius:var(--r3);border:1px solid var(--border);background:rgba(0,0,0,.25);font-family:var(--serif);font-size:12.5px;line-height:1.5;color:#cbd5e1;max-height:220px;overflow:auto;white-space:pre-wrap;margin-bottom:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:9500;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--muted);font-size:13px;margin-bottom:12px;white-space:pre-line;line-height:1.55}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions .btn{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;font-weight:600;font-size:13px;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;pointer-events:none;animation:popIn .25s}
.toast-ok{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.toast-err{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.toast-info{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff}
.toast-warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
@keyframes popIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.type-menu{position:absolute;z-index:60;background:var(--card);border:1px solid var(--border2);border-radius:var(--r3);box-shadow:0 8px 32px rgba(0,0,0,.5);padding:5px;display:flex;flex-direction:column;gap:2px;min-width:180px}
.type-menu button{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:5px;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.type-menu button:hover{background:rgba(124,58,237,.12)}
.type-menu button.current{background:rgba(124,58,237,.2);color:#c4b5fd;cursor:default}
.type-menu .hint{font-size:10.5px;color:var(--muted);padding:4px 10px;font-weight:400;border-top:1px solid var(--border);margin-top:3px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9200;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px}
.hist-list{display:flex;flex-direction:column;gap:8px}
.hist-card{padding:11px 13px;border-radius:var(--r2);background:rgba(255,255,255,.03);border:1.5px solid var(--border);cursor:pointer;transition:.15s}
.hist-card:hover{border-color:var(--violet);background:rgba(124,58,237,.06)}
.hist-card.current{border-color:var(--emerald);background:rgba(16,185,129,.06)}
.hist-card-title{font-size:14px;font-weight:700;line-height:1.35;color:#fff;margin-bottom:5px}
.hist-card-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--muted);margin-bottom:6px}
.hist-card-actions{display:flex;gap:5px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--border)}
.hist-empty{text-align:center;padding:40px 16px;color:var(--muted);border:2px dashed var(--border2);border-radius:var(--r2)}
.hist-empty .ico{font-size:44px;margin-bottom:8px;opacity:.4}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.img-btn{background:transparent;border:1.5px solid var(--border2);color:var(--muted);border-radius:5px;width:32px;height:32px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;padding:0;font-family:var(--font)}
.img-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.img-btn.has{border-color:var(--emerald);color:#6ee7b7;background:rgba(16,185,129,.1)}
.opt-thumb-small{width:36px;height:36px;object-fit:cover;border-radius:5px;border:1px solid var(--border);cursor:zoom-in;flex-shrink:0;background:#0a0e1a}
.sub-thumb{margin-left:27px;margin-bottom:6px;max-width:120px;max-height:80px;border-radius:5px;border:1px solid var(--border);cursor:zoom-in;display:block;background:#0a0e1a}
.mode-opt{display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:rgba(255,255,255,.02);color:var(--text);font-family:var(--font);cursor:pointer;margin-bottom:6px;text-align:left;font-size:13px;transition:.12s}
.mode-opt:hover{border-color:var(--violet);background:rgba(124,58,237,.08)}
.mode-opt .ico{font-size:22px;flex-shrink:0}
.mode-opt b{display:block;margin-bottom:2px}
.mode-opt small{color:var(--muted);font-size:11.5px;font-weight:400}
@media(max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr 1fr}#app{padding:12px 10px 40px}.header h1{font-size:22px}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>⚡ Quiz Converter</h1>
    <p>PDF · DOCX · TXT → JSON cho Quiz Master — Giữ định dạng & bố cục</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="file" onclick="switchTab('file')">📁 Upload</div>
    <div class="tab" data-tab="paste" onclick="switchTab('paste')">📝 Dán văn bản</div>
    <div class="tab" data-tab="history" onclick="switchTab('history')">📚 Lịch sử <span id="hist-count" style="font-size:10px;background:rgba(124,58,237,.3);color:#c4b5fd;padding:1px 6px;border-radius:99px;margin-left:4px">0</span></div>
  </div>

  <div id="tab-file">
    <div class="glass" style="padding:14px">
      <label class="upload-zone" id="dropzone" for="file-input">
        <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.json">
        <div class="icon">📄</div>
        <h3>Kéo thả file hoặc click để chọn</h3>
        <p>.pdf · .docx · .txt · .json · Nhiều file cùng lúc</p>
      </label>
      <div class="file-list" id="file-list"></div>
      <div class="progress" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <div id="tab-paste" style="display:none">
    <div class="glass" style="padding:14px">
      <label class="lbl">Dán nội dung đề cương</label>
      <textarea class="inp" id="paste-input" style="min-height:220px;font-family:var(--serif);font-size:13px;line-height:1.55" placeholder="Câu 1. ...&#10;A. ... B. ... C. ... D. ...&#10;=> Đáp án: C&#10;=> Giải thích: ..."></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-violet" style="flex:1;min-width:140px" onclick="parsePasted()">🚀 Phân tích</button>
        <button class="btn btn-ghost" onclick="document.getElementById('paste-input').value=''">🗑 Xoá</button>
      </div>
    </div>
  </div>

  <div id="tab-history" style="display:none">
    <div class="glass" style="padding:14px">
      <div class="section-head" style="margin-bottom:10px">
        <h2>📚 Bộ đề đã lưu</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-violet btn-sm" onclick="startNewSet();switchTab('file')">➕ Tạo bộ mới</button>
          <button class="btn btn-ghost btn-sm" onclick="exportAllHistory()">📦 Xuất tất cả</button>
          <button class="btn btn-danger btn-sm" onclick="confirmClearHistory()">🗑 Xoá hết</button>
        </div>
      </div>
      <div id="hist-container"></div>
    </div>
  </div>

  <div class="section glass" id="settings-section" style="padding:14px;display:none">
    <div class="section-head" style="margin-bottom:8px">
      <h2>⚙️ Cài đặt bộ đề</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-violet btn-xs" onclick="startNewSet()">➕ Tạo bộ mới</button>
        <button class="btn btn-ghost btn-xs" onclick="renameCurrentSet()">✏️ Đổi tên</button>
        <button class="btn btn-cyan btn-xs" onclick="saveToHistory()">💾 Lưu lịch sử</button>
      </div>
    </div>
    <div class="grid-4">
      <div><label class="lbl">Tên bộ đề</label><input class="inp" id="set-name" oninput="markDirty()"></div>
      <div><label class="lbl">⏱ mcq (giây)</label><input class="inp" id="set-time-mcq" type="number" min="5" max="300" value="20" oninput="markDirty()"></div>
      <div><label class="lbl">⏱ tf (giây)</label><input class="inp" id="set-time-tf" type="number" min="5" max="300" value="40" oninput="markDirty()"></div>
      <div><label class="lbl">⏱ tnl (giây)</label><input class="inp" id="set-time-tnl" type="number" min="5" max="300" value="60" oninput="markDirty()"></div>
    </div>
    <div class="grid-3" style="margin-top:8px">
      <div><label class="lbl">⏱ tl (giây)</label><input class="inp" id="set-time-tl" type="number" min="5" max="600" value="120" oninput="markDirty()"></div>
      <div><label class="lbl">💡 Số gợi ý</label><input class="inp" id="set-hints" type="number" min="1" max="20" value="3" oninput="markDirty()"></div>
      <div><label class="lbl">🖼️ Chất lượng ảnh</label>
        <select class="inp" id="set-img-q"><option value="0.72">Nhẹ (0.72)</option><option value="0.82" selected>Cân bằng (0.82)</option><option value="0.92">Nét (0.92)</option></select>
      </div>
    </div>
  </div>

  <div class="section" id="stats-section" style="display:none">
    <div class="stats">
      <div class="stat">📝 <span id="st-total">0</span> câu</div>
      <div class="stat mcq">🔘 <span id="st-mcq">0</span> ABCD</div>
      <div class="stat tf">✅ <span id="st-tf">0</span> Đ/S</div>
      <div class="stat tnl">✏️ <span id="st-tnl">0</span> TLN</div>
      <div class="stat tl">📖 <span id="st-tl">0</span> TL</div>
      <div class="stat err">❌ <span id="st-err">0</span> lỗi</div>
    </div>
  </div>

  <div class="section" id="preview-section" style="display:none">
    <div class="section-head">
      <h2>📋 Xem trước <span style="font-size:12px;color:var(--muted)" id="q-count-badge">0 câu</span></h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="addBlankQuestion()">+ Câu</button>
        <button class="btn btn-ghost btn-sm" id="filter-btn" onclick="filterIssuesOnly()">🔍 Chỉ lỗi</button>
        <button class="btn btn-emerald btn-sm" onclick="exportJSON()">💾 Tải JSON</button>
      </div>
    </div>

/* ═══ Rich text ═══ */

/* ═══ Storage ═══ */

/* ═══ State ═══ */
const ST={questions:[],nextQid:1,currentSetId:null,currentSetName:'Bộ đề mới',isDirty:false,showIssuesOnly:false,activeTab:'file',pdfImagesByFile:{}};

/* ═══ Clean ═══ */
function cleanText(raw){if(!raw)return'';let t=String(raw).replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/[\u2018\u2019\u201B]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\t/g,' ').replace(/[\u200b\ufeff]/g,'');t=normalizePandoc(t);t=normalizeInlineTags(t);t=t.replace(/^\s*=+\s*Page\s+\d+\s*=+\s*$/gim,'');t=t.replace(/\{\{PAGE:\d+\}\}/g,'\n');const lines=t.split('\n');const lc={};for(const l of lines){const k=l.trim();if(k.length>4&&k.length<80)lc[k]=(lc[k]||0)+1;}const rep=new Set();for(const k in lc)if(lc[k]>=3)rep.add(k);const filtered=[];for(const l of lines){const k=l.trim();if(rep.has(k)&&!/^Câu\s+\d/.test(k)&&!/^Phần\s+[IVX\d]/.test(k))continue;if(/^Trang\s+\d+\s*$/i.test(k))continue;filtered.push(l);}t=filtered.join('\n');t=t.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();t=normalizeBlanks(t);return t;}

/* ═══ Segment ═══ */
function segment(text){const markers=[];const qre=/(?:^|\n)[\s*_]*(?:Câu|Question|Câu hỏi)\s+(\d+(?:[.\-]\d+)*)[\s*_:.\-)]*/gi;let m;while((m=qre.exec(text))!==null)markers.push({num:m[1],start:m.index,cs:m.index+m[0].length});if(markers.length<3){const altRe=/(?:^|\n)[\s*_]*(\d{1,3})[\s*_]*[.)\-][\s*_]+/g;while((m=altRe.exec(text))!==null)markers.push({num:m[1],start:m.index,cs:m.index+m[0].length});}if(!markers.length)return[{raw:text.trim(),num:'?',section:''}];let sec='';const secM=[];let sm;const secRe=/(?:^|\n)[\s*_]*(PHẦN\s+[IVX\d]+|Phần\s+[IVX\d]+|CHƯƠNG\s+[IVX\d]+|Chương\s+[IVX\d]+|CHỦ ĐỀ\s+\d+|Chủ đề\s+\d+|(?:I{1,3}|IV|V|VI|VII|VIII|IX|X)\.\s+[A-ZÀ-Ỹ][^\n]*)/g;while((sm=secRe.exec(text))!==null)secM.push({p:sm.index,t:sm[0].trim()});const out=[];for(let i=0;i<markers.length;i++){const s=markers[i].start;const e=i+1<markers.length?markers[i+1].start:text.length;for(const x of secM)if(x.p<s)sec=x.t;out.push({num:markers[i].num,raw:text.slice(markers[i].cs,e).trim(),section:sec});}return out;}

/* ═══ Parse ═══ */
function parseBoolAns(s){if(!s)return null;const t=s.trim().toUpperCase();if(/^(ĐÚNG|ĐUNG|DUNG|Đ|TRUE|T\b|YES|Y\b|✔|✓|CORRECT)/i.test(t))return true;if(/^(SAI|FALSE|F\b|NO|N\b|✘|✗|X\b|INCORRECT)/i.test(t))return false;return null;}
/* v10.2: regex mới xử lý markdown **A.** / __A.__ / A. */
function splitOptions(region){
  const re=/(?:^|[\s\n*_])(?:\*{1,2}|_{1,2})*([A-D])(?:\*{1,2}|_{1,2})*\s*[.)\-]\s+/g;
  const found=[];let exp='A',mm;
  while((mm=re.exec(region))!==null){
    const L=mm[1].toUpperCase();
    /* bỏ qua nếu ký tự ngay trước là chữ cái (vitamin A.) */
    const prevChar=region[mm.index-1];
    if(prevChar&&/[A-Za-zÀ-ỹ]/.test(prevChar))continue;

  }

    const e=i+1<found.length?found[i+1].idx:region.length;
    let body=region.slice(s,e).trim().replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').trim();

    body=body.replace(/\s+(?:\*{1,2}|_{1,2})?\s*[A-D]\s*(?:\*{1,2}|_{1,2})?\s*[.)\-]\s*$/,'').trim();

function parseBlock(block){
  const raw={stemText:'',optionsText:[],subItemsText:[],answerRaw:'',explanationRaw:''};
  if(!block||!block.raw)return raw;

  const expRe=/(?:^|\n)[\s*_]*(?:(?:=>|->)\s*)?(?:Giải\s*thích(?:\s*chi\s*tiết(?:\s*cho\s*người\s*mất\s*gốc)?)?|Lời\s*giải(?:\s*chi\s*tiết)?|Hướng\s*dẫn\s*giải|Explanation)\s*[:.]?\s*([\s\S]*?)(?=\n[\s*_]*(?:(?:=>|->)\s*)?(?:Giải\s*thích|Lời\s*giải|Hướng\s*dẫn|Dịch\s*nghĩa|Câu\s+\d|Question\s+\d)|$)/gi;
  let em=expRe.exec(text);
  if(em){raw.explanationRaw=em[1].trim();text=text.slice(0,em.index)+'\n'+text.slice(em.index+em[0].length);}
  const multiRe=/(?:^|\n)[\s*_]*(?:(?:=>|->)\s*)?Đáp\s*án\s+([a-d])\s*[:.]?\s*([^\n]+)/gi;

    const ansRe=/(?:^|\n)[\s*_]*(?:(?:=>|->)\s*)?(?:Đáp\s*án(?:\s*đúng)?|Đáp\s*số|ĐA|Answer|Key)\s*(?:\s+[a-dA-D])?\s*[:.]?\s*([^\n]+)/gi;

  }

/* ═══ Classify ═══ */
function classify(raw,section){
  const s=raw.stemText||'';
  const full=((raw.stemText||'')+'\n'+(raw.explanationRaw||'')).toLowerCase();
  const sec=(section||'').toLowerCase();
  const sc={mcq:0,tf:0,tnl:0,tl:0};
  if(/trắc\s*nghiệm|nhiều\s*phương\s*án|lựa\s*chọn|multiple/i.test(sec))sc.mcq+=6;
  if(/đúng\s*\/?\s*sai|đúng\s*hay\s*sai/i.test(sec))sc.tf+=6;
  if(/trả\s*lời\s*ngắn|điền\s*ngắn/i.test(sec))sc.tnl+=6;
  if(/tự\s*luận|đọc\s*hiểu|viết|nghị\s*luận/i.test(sec))sc.tl+=6;
  const nOpts=(raw.optionsText||[]).length;
  const nSubs=(raw.subItemsText||[]).length;
  /* v10.2: trọng số MCQ cao hơn */
  if(nOpts>=3)sc.mcq+=12;
  else if(nOpts===2)sc.mcq+=3;
  if(nSubs>=2){
    const withAns=raw.subItemsText.filter(x=>x.answer!==null).length;
    if(withAns>=Math.max(2,Math.floor(nSubs*0.6)))sc.tf+=6;
    else sc.tl+=3;
    if(nSubs===3||nSubs===4)sc.tf+=2;
  }
  const ans=raw.answerRaw||'';
  if(ans){
    if(/^[A-D](?:[.)\-\s]|$)/i.test(ans.trim()))sc.mcq+=4;
    else if(/^(ĐÚNG|SAI|TRUE|FALSE|Đ|S)\b/i.test(ans.trim()))sc.tf+=3;
    else if(ans.trim().length<=40&&!/[.!?]\s+[A-Z]/.test(ans))sc.tnl+=3;
    else if(ans.trim().length>80||/[.!?]\s+/.test(ans))sc.tl+=3;
  }
  if(/(?:nêu|trình\s*bày|phân\s*tích|cảm\s*nhận|so\s*sánh|viết\s*(?:một\s*)?đoạn|vì\s*sao)/i.test(full))sc.tl+=2;
  if(/(?:tính|tìm|xác\s*định|giá\s*trị\s*của|kết\s*quả)/i.test(full)&&!nOpts)sc.tnl+=2;
  if(/(?:mỗi\s*nhận\s*định|đọc\s*đoạn\s*tư\s*liệu)/i.test(full))sc.tf+=4;
  /* v10.2: có ≥3 phương án thì không thể là TLN/TL */
  if(nOpts>=3){sc.tnl=0;sc.tl=Math.min(sc.tl,1);}

  if(stemLen>200)sc.tl+=2;
  const order=['mcq','tf','tnl','tl'];
  let best='mcq',bs=-1;
  for(const k of order)if(sc[k]>bs){best=k;bs=sc[k];}

/* ═══ Build ═══ */
function genAnsAlt(a){const v=new Set();const b=String(a).trim();if(!b)return'';if(/^\d+[,.]\d+$/.test(b)){v.add(b.replace(',','.'));v.add(b.replace('.',','));}v.add(b.replace(/\s+/g,''));v.add(b.replace(/(\d),(\d{3})/g,'$1$2'));v.delete(b);return[...v].filter(x=>x&&x!==b).slice(0,2).join(' | ');}
function buildMCQ(raw){

  if(!opts.length)return {ok:false,issues:['Không có phương án']};
  let idx=0;
  const a=(raw.answerRaw||'').trim();
  if(a){
    const m=a.match(/^[\s\[(]*\*{0,2}\s*([A-D])\b/i);
    if(m){const i=opts.findIndex(o=>o.letter===m[1].toUpperCase());if(i>=0)idx=i;}
    else{
      const norm=x=>x.toLowerCase().replace(/[\s.,;:!?"'()\[\]{}*_\-–—]+/g,'').trim();

      for(let i=0;i<opts.length;i++){if(norm(opts[i].text).startsWith(tgt)||tgt.startsWith(norm(opts[i].text))){found=i;break;}}

function buildTF(raw){

  if(subs.length<2)return {ok:false,issues:['Không đủ ý a–d']};
  const withAns=subs.filter(x=>x.answer!==null).length;
  if(withAns<2)return {ok:false,issues:['Thiếu đáp án Đ/S']};
  const subQuestions=subs.map(x=>({text:x.text,image:''}));
  const subAnswers=subs.map(x=>x.answer);
  let hint=raw.explanationRaw||'';
  if(!hint&&raw.answerPerSub){const p=[];for(const k in raw.answerPerSub)p.push(k+') '+(raw.answerPerSub[k]?'Đúng':'Sai'));hint=p.join('; ');}
  return {ok:true,type:'tf',question:raw.stemText,subQuestions,subAnswers,options:['Đúng','Sai'],hint};
}
function buildTNL(raw){let ans=(raw.answerRaw||'').trim();if(!ans)return {ok:false,issues:['Thiếu đáp án']};ans=ans.replace(/^[\s\[(]*[A-D][.)]?\s*/,'').replace(/[.\s]+$/,'').trim();return {ok:true,type:'tnl',question:raw.stemText,answer:ans,answerAlt:genAnsAlt(ans),hint:raw.explanationRaw||''};}
function buildTL(raw){return {ok:true,type:'tl',question:raw.stemText,answer:(raw.explanationRaw||raw.answerRaw||'').trim(),hint:''};}

/* ═══ Pipeline ═══ */
function buildQuestion(block){
  const raw=parseBlock(block);
  const {type,confidence,scores}=classify(raw,block.section);
  let built;
  if(type==='mcq')built=buildMCQ(raw);
  else if(type==='tf')built=buildTF(raw);
  else if(type==='tnl')built=buildTNL(raw);
  else built=buildTL(raw);
  if(!built.ok){
    for(const t of ['mcq','tf','tnl','tl']){
      if(t===type)continue;
      const b=t==='mcq'?buildMCQ(raw):t==='tf'?buildTF(raw):t==='tnl'?buildTNL(raw):buildTL(raw);
      if(b.ok){built=b;break;}
    }
  }
  /* v10.2: fallback MCQ khi có ≥3 phương án nhưng build fail */
  if(!built.ok&&raw.optionsText&&raw.optionsText.length>=3){
    built={ok:true,type:'mcq',question:raw.stemText||'',options:raw.optionsText.map(o=>o.text),answer:0,hint:raw.explanationRaw||'',issues:['Không tìm thấy đáp án — mặc định A']};
  }
  if(!built.ok)return null;
  const q={id:0,type:built.type,question:built.question||'',hint:built.hint||'',section:block.section||'',_sourceNum:block.num,_confidence:confidence,_typeScores:scores,_origType:type,_issues:built.issues||[],_raw:{stemText:raw.stemText,optionsText:raw.optionsText,subItemsText:raw.subItemsText,answerRaw:raw.answerRaw,explanationRaw:raw.explanationRaw}};
  if(built.type==='mcq'){q.options=built.options||[];q.answer=built.answer||0;q.optImages=(built.options||[]).map(()=>'');}
  else if(built.type==='tf'){q.subQuestions=built.subQuestions||[];q.subAnswers=built.subAnswers||[];q.options=['Đúng','Sai'];}
  else if(built.type==='tnl'){q.answer=built.answer||'';q.answerAlt=built.answerAlt||'';}
  else if(built.type==='tl'){q.answer=built.answer||'';}
  return q;
}
/* v10.2: gộp yêu cầu chung vào câu đầu tiên */
function parseAll(text){
  const blocks=segment(text);
  const out=[];
  let pendingStem='';
  const isInstruction=(t)=>{
    if(!t)return false;
    if(t.length>900)return false;
    if(/(?:^|\n)\s*[A-D]\s*[.)]\s/.test(t))return false;
    if(/^\s*[a-d]\s*[.)]\s/im.test(t))return false;
    return /^(?:Mark\s+the\s+letter|Choose\s+the\s+(?:best|correct)|Chọn\s+(?:đáp\s*án|phương\s*án)|Read\s+the\s+following|Đọc\s+(?:đoạn|bài)|Trả\s+lời\s+các\s+câu|Dựa\s+vào|Hãy\s+(?:chọn|đọc)|Yêu\s+cầu|PHẦN\s+[IVX\d]|Phần\s+[IVX\d]|(?:I{1,3}|IV|V)\.\s+[A-ZÀ-Ỹ])/im.test(t);
  };
  for(let bi=0;bi<blocks.length;bi++){
    const b=blocks[bi];
    const raw=(b.raw||'').trim();
    const q=buildQuestion(b);
    if(!q){
      /* Không build được câu → có thể là yêu cầu chung */
      if(isInstruction(raw)||(raw.length<500&&!/[A-D]\s*[.)]/.test(raw)&&!/(?:=>|->)\s*Đáp/i.test(raw)&&!/^\s*[a-d]\s*[.)]/im.test(raw))){
        pendingStem=(pendingStem?pendingStem+'\n':'')+raw;
      }
      continue;
    }
    /* v10.2: ghép yêu cầu chung vào đầu câu */
    if(pendingStem&&q){
      const head=pendingStem.slice(0,60);
      if(!q.question.startsWith(head)&&!q.question.includes(head)){
        q.question=pendingStem+'\n\n'+q.question;
        if(q._raw)q._raw.stemText=q.question;
      }
      pendingStem='';
    }
    q.id=ST.nextQid++;
    out.push(q);
  }
  return out;
}

/* ═══ Validate ═══ */
function validate(q){
  const i=[];
  if(!q.question||!q.question.trim())i.push({level:'err',msg:'Câu hỏi rỗng'});
  if(q._confidence<0.55)i.push({level:'warn',msg:'Độ tin cậy thấp ('+(q._confidence*100).toFixed(0)+'%)'});
  if(q.type==='mcq'){
    if(!q.options||q.options.length<2)i.push({level:'err',msg:'mcq thiếu phương án'});
    if(typeof q.answer!=='number'||q.answer<0||q.answer>=(q.options||[]).length)i.push({level:'err',msg:'Đáp án không hợp lệ'});
  }
  if(q.type==='tf'){
    if(!q.subQuestions||q.subQuestions.length<2)i.push({level:'err',msg:'tf thiếu ý'});
    if(!q.subAnswers||q.subAnswers.length!==(q.subQuestions||[]).length)i.push({level:'err',msg:'Đáp án không khớp'});
    const hasAns=(q.subAnswers||[]).filter(a=>a!==null&&a!==undefined).length;
    if(hasAns<2)i.push({level:'err',msg:'Thiếu đáp án Đ/S'});
  }
  if(q.type==='tnl'&&(!q.answer||!String(q.answer).trim()))i.push({level:'err',msg:'Thiếu đáp án'});
  const chk=(q.question||'')+(q.hint||'');
  if(/[\uE000-\uF8FF\uFFFD]/.test(chk))i.push({level:'warn',msg:'Ký tự math/font đặc biệt, có thể cần ảnh'});
  return i;
}

/* ═══ Extract PDF ═══ */
async function extractPDF(file){
  if(!window.pdfjsLib)throw new Error('pdf.js chưa nạp');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let fullText='';
  const imagesByPage={};
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const items=content.items.filter(it=>it.str&&it.transform);
    let hasImage=false;
    try{
      const ops=await page.getOperatorList();
      const imgOps=[pdfjsLib.OPS.paintImageXObject,pdfjsLib.OPS.paintJpegXObject,pdfjsLib.OPS.paintInlineImageXObject];
      for(let i=0;i<ops.fnArray.length;i++){if(imgOps.includes(ops.fnArray[i])){hasImage=true;break;}}
    }catch(e){}
    if(hasImage){
      try{
        const vp=page.getViewport({scale:1.7});
        const canvas=document.createElement('canvas');
        canvas.width=vp.width;canvas.height=vp.height;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        await page.render({canvasContext:ctx,viewport:vp}).promise;
        const maxW=1100;
        if(canvas.width>maxW){
          const c2=document.createElement('canvas');
          c2.width=maxW;c2.height=Math.round(canvas.height*maxW/canvas.width);
          c2.getContext('2d').drawImage(canvas,0,0,c2.width,c2.height);
          imagesByPage[p]=c2.toDataURL('image/jpeg',0.75);
        } else imagesByPage[p]=canvas.toDataURL('image/jpeg',0.75);
      }catch(e){}
    }
    if(!items.length){fullText+='\n';continue;}
    const byY=new Map();
    for(const it of items){const y=Math.round(it.transform[5]);if(!byY.has(y))byY.set(y,[]);byY.get(y).push(it);}
    const sy=[...byY.keys()].sort((a,b)=>b-a);
    let prevLine=null;
    for(const y of sy){
      const row=byY.get(y).sort((a,b)=>a.transform[4]-b.transform[4]);
      let line='',prevEnd=null;
      for(const it of row){
        if(prevEnd!==null&&it.transform[4]-prevEnd>1.5&&line&&!line.endsWith(' '))line+=' ';
        line+=it.str;
        prevEnd=it.transform[4]+(it.width||0);
      }
      const t=line.trim();
      if(!t)continue;
      let hard=false;
      if(prevLine){
        const maxFs=Math.max(...row.map(x=>Math.abs(x.transform[3]||12)));
        if(prevLine.y-y>maxFs*1.45)hard=true;
        else if(/[:：]\s*$/.test(prevLine.text))hard=true;
        else if(/^\s*(?:[a-dA-D][.)]\s|[-•+*]\s|\d+[.)]\s|\([\dA-Da-d]+\)|I{1,3}V?\.|IV\.|V\.|=>|->|Tư\s*liệu|Nguồn|Câu\s+\d|Phần\s+[IVX\d]|Chương\s+|CHỦ ĐỀ)/.test(t))hard=true;
      }
      if(hard||!prevLine)fullText+=t+'\n';
      else fullText=fullText.slice(0,-1)+t+'\n';
      prevLine={y,text:t};
    }
    fullText+='\n{{PAGE:'+p+'}}\n';
  }
  return {text:fullText,imagesByPage};
}

/* ═══ Extract DOCX ═══ */
async function extractDOCX(file){
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const buf=await file.arrayBuffer();
  const zip=await JSZip.loadAsync(buf);
  const docXmlFile=zip.file('word/document.xml');
  if(!docXmlFile)throw new Error('Không có word/document.xml');
  const docXml=await docXmlFile.async('string');
  let doc;
  try{doc=new DOMParser().parseFromString(docXml,'application/xml');}catch(e){throw new Error('XML lỗi');}
  const body=doc.getElementsByTagNameNS(W,'body')[0];
  if(!body)throw new Error('Không có body');
  const lines=[];
  const getAttr=(el,n)=>{let v=el.getAttributeNS(W,n);if(v===null)v=el.getAttribute('w:'+n);if(v===null)v=el.getAttribute(n);return v;};
  const hasProp=(rPr,tag)=>{if(!rPr)return false;const els=rPr.getElementsByTagNameNS(W,tag);if(!els.length)return false;const v=getAttr(els[0],'val');if(v===null||v===undefined)return true;const s=String(v).toLowerCase();if(s==='0'||s==='false'||s==='none'||s==='off')return false;return true;};
  function parseRun(r){const rPr=r.getElementsByTagNameNS(W,'rPr')[0];const isU=hasProp(rPr,'u');const isB=hasProp(rPr,'b');const isI=hasProp(rPr,'i');let text='';for(const c of r.childNodes){if(c.nodeType!==1)continue;const tg=c.localName;if(tg==='t')text+=c.textContent;else if(tg==='br')text+='\n';else if(tg==='tab')text+=' ';else if(tg==='noBreakHyphen')text+='-';}if(!text)return'';let out=text;if(isU&&!/^\s+$/.test(out))out='__'+out+'__';if(isI&&!/^\s+$/.test(out))out='*'+out+'*';if(isB&&!/^\s+$/.test(out))out='**'+out+'**';return out;}
  function parseP(p){let out='';for(const c of p.childNodes){if(c.nodeType!==1)continue;const tg=c.localName;if(tg==='r')out+=parseRun(c);else if(tg==='hyperlink'||tg==='smartTag'||tg==='ins'||tg==='sdt'||tg==='sdtContent'){for(const s of c.childNodes)if(s.nodeType===1&&s.localName==='r')out+=parseRun(s);}}return out;}
  function walk(el){for(const c of el.childNodes){if(c.nodeType!==1)continue;const tg=c.localName;if(tg==='p')lines.push(parseP(c));else if(tg==='tbl'){const rows=c.getElementsByTagNameNS(W,'tr');for(const row of rows){const cells=row.getElementsByTagNameNS(W,'tc');const arr=[];for(const cell of cells){const ps=cell.getElementsByTagNameNS(W,'p');const parts=[];for(const cp of ps)parts.push(parseP(cp));arr.push(parts.join(' ').trim());}lines.push(arr.join(' | '));}}else if(tg==='sdt'){for(const sc of c.getElementsByTagNameNS(W,'sdtContent'))walk(sc);}}}
  walk(body);
  return {text:lines.join('\n')};
}

/* ═══ File handling ═══ */
function init(){bindEvents();refreshHistCount();refreshUI();}
function bindEvents(){const dz=$('#dropzone'),fi=$('#file-input');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('drag');}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('drag');}));dz.addEventListener('drop',e=>{const files=[...(e.dataTransfer.files||[])];if(files.length)handleFiles(files);});fi.addEventListener('change',e=>{const files=[...(e.target.files||[])];e.target.value='';if(files.length)handleFiles(files);});}
function switchTab(name){ST.activeTab=name;$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));$('#tab-file').style.display=name==='file'?'':'none';$('#tab-paste').style.display=name==='paste'?'':'none';$('#tab-history').style.display=name==='history'?'':'none';if(name==='history')renderHistory();}
function setProgress(p){const b=$('#progress-bar'),f=$('#progress-fill');if(p<=0||p>=1){b.style.display='none';return;}b.style.display='';f.style.width=(p*100)+'%';}
function askUploadMode(firstFileName){
  return new Promise(resolve=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<h3>📁 Nhập file — chọn chế độ</h3><p>Bộ hiện tại: <b style="color:#a78bfa">${esc(ST.currentSetName)}</b> — ${ST.questions.length} câu.</p>
      <button class="mode-opt" data-x="new"><span class="ico">🆕</span><div><b>Tạo bộ mới</b><small>Xoá hết câu hiện tại, tạo bộ mới từ "${esc(firstFileName||'file')}"</small></div></button>
      <button class="mode-opt" data-x="append"><span class="ico">➕</span><div><b>Thêm vào bộ hiện tại</b><small>Gộp câu từ file vào "${esc(ST.currentSetName)}"</small></div></button>
      <div class="modal-actions"><button class="btn btn-ghost btn-full" data-x="cancel">Huỷ</button></div>`;
    bg.appendChild(m);document.body.appendChild(bg);

    m.querySelector('[data-x="cancel"]').onclick=()=>done(null);

}
async function handleFiles(files){
  let mode='new';
  if(ST.questions.length>0){
    mode=await askUploadMode(files[0]?.name||'');
    if(!mode)return;
  }
  if(mode==='new'){
    ST.questions=[];ST.nextQid=1;ST.currentSetId=null;
    ST.currentSetName=deriveSetName(files[0]);
    ST.pdfImagesByFile={};
    const fl=$('#file-list');if(fl)fl.innerHTML='';
    const n=$('#set-name');if(n)n.value=ST.currentSetName;
  }
  setProgress(0.05);
  let total=files.length,done=0;
  for(const f of files){
    try{await processFile(f);}catch(err){console.error(err);toast('❌ '+f.name+': '+err.message,'err',4000);}
    done++;setProgress(done/total);
  }
  setTimeout(()=>setProgress(0),300);
  refreshUI();
  if(ST.questions.length)toast('✅ Tổng '+ST.questions.length+' câu trong bộ','ok');
}
function deriveSetName(file){if(!file)return'Bộ đề mới';return file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().slice(0,80)||'Bộ đề mới';}
async function processFile(file){
  const name=file.name,ext=(name.split('.').pop()||'').toLowerCase();
  addFileItem(name,'work');
  let result;
  try{
    if(ext==='pdf')result=await extractPDF(file);
    else if(ext==='docx')result=await extractDOCX(file);
    else if(ext==='txt')result={text:await file.text()};
    else if(ext==='json'){await processJSON(file);updateFileItem(name,'ok','JSON');return;}
    else throw new Error('Định dạng không hỗ trợ: .'+ext);
  }catch(err){updateFileItem(name,'err',err.message);throw err;}
  if(result.imagesByPage&&Object.keys(result.imagesByPage).length){
    ST.pdfImagesByFile[name]=result.imagesByPage;
  }
  const cleaned=cleanText(result.text);
  const qs=parseAll(cleaned);
  for(const q of qs){
    q._issues=validate(q);
    q._file=name;
    if(/hình|sơ\s*đồ|biểu\s*đồ|đồ\s*thị|bảng|thí\s*nghiệm/i.test(q.question)&&result.imagesByPage&&Object.keys(result.imagesByPage).length){
      q._issues.push({level:'warn',msg:'Câu có thể cần ảnh — bấm "🖼️ Từ PDF" để chọn'});
    }
  }
  ST.questions.push(...qs);
  updateFileItem(name,qs.length?'ok':'err',qs.length+' câu');
}
async function processJSON(file){
  const text=await file.text();
  let data;
  try{data=JSON.parse(text.replace(/^\uFEFF/,''));}catch(e){throw new Error('JSON lỗi: '+e.message);}
  const raw=Array.isArray(data)?data:(data&&Array.isArray(data.questions)?data.questions:[]);
  for(const q of raw){
    if(!q||!q.question)continue;
    const nq={id:ST.nextQid++,type:q.type||'mcq',question:String(q.question),hint:String(q.hint||''),section:q.section||''};
    if(q.image)nq.image=q.image;
    if(nq.type==='mcq'){nq.options=Array.isArray(q.options)?q.options:[];nq.answer=typeof q.answer==='number'?q.answer:0;if(q.optImages)nq.optImages=q.optImages;}
    else if(nq.type==='tf'){nq.subQuestions=q.subQuestions||[];nq.subAnswers=q.subAnswers||[];nq.options=q.options||['Đúng','Sai'];}
    else{nq.answer=String(q.answer||'');if(q.answerAlt)nq.answerAlt=q.answerAlt;}
    nq._issues=validate(nq);
    ST.questions.push(nq);
  }
  if(data&&typeof data==='object'&&!Array.isArray(data)&&data.name){ST.currentSetName=data.name;const el=$('#set-name');if(el)el.value=data.name;}
}
function addFileItem(name,status,meta){const list=$('#file-list');const el=document.createElement('div');el.className='file-item';el.dataset.name=name;const ext=(name.split('.').pop()||'').toLowerCase();const ico=ext==='pdf'?'📕':ext==='docx'?'📘':ext==='json'?'📋':ext==='txt'?'📄':'📁';el.innerHTML=`<span class="ico">${ico}</span><div class="info"><div class="name">${esc(name)}</div><div class="meta">${meta||''}</div></div><span class="status st-${status}">${status==='work'?'Đang xử lý':status==='ok'?'OK':status==='err'?'Lỗi':'—'}</span>`;list.appendChild(el);}

function renderQCard(q,i){

  let body='';
  if(q.type==='mcq'){
    body=`<div class="lbl">Các phương án — bấm ＋ để thêm ảnh cho từng phương án</div>
      ${(q.options||[]).map((o,oi)=>{

            ${hasImg?`<button class="img-btn" onclick="clearSubImage(${i},${si})" title="Xoá ảnh">✕</button>`:''}
          </div>
          ${hasImg?`<img src="${sq.image}" class="sub-thumb" onclick="openLightbox(this.src)">`:''}
          <div class="sub-q-ans">
            <button class="sub-btn ${a===true?'on-t':''}" onclick="setSubAns(${i},${si},true)">✓ Đúng</button>
            <button class="sub-btn ${a===false?'on-f':''}" onclick="setSubAns(${i},${si},false)">✗ Sai</button>
          </div>

      }).join('')}`;
  } else if(q.type==='tnl'){
    body=`<div class="lbl">Đáp án ngắn</div><input class="inp" value="${escA(q.answer||'')}" oninput="setAns(${i},this.value)"><div class="lbl" style="margin-top:5px">Đáp án thay thế (cách nhau " | ")</div><input class="inp" value="${escA(q.answerAlt||'')}" oninput="setAlt(${i},this.value)">`;
  } else {
    body=`<div class="lbl">Đáp án mẫu</div><textarea class="inp" oninput="setAns(${i},this.value)" style="min-height:100px;font-family:var(--serif)">${esc(q.answer||'')}</textarea>`;
  }
  body+=`<div class="lbl" style="margin-top:6px">Gợi ý / Giải thích</div><textarea class="inp" oninput="setHint(${i},this.value)" style="min-height:50px;font-family:var(--serif)">${esc(q.hint||'')}</textarea>`;
  let issHTML='';
  if(iss.length)issHTML=`<div class="issues ${hasErr?'err':'warn'}">${iss.map(x=>`${x.level==='err'?'❌':'⚠️'} ${esc(x.msg)}`).join('<br>')}</div>`;
  const pdfBtn=(ST.pdfImagesByFile&&Object.keys(ST.pdfImagesByFile).length)?`<button class="btn btn-ghost btn-xs" onclick="openPdfImagePicker(${i})">🖼️ Từ PDF</button>`:'';
  return `
    <div class="${cls}" data-idx="${i}">
      <div class="q-head">
        <div class="q-head-left"><span class="q-num">Câu ${i+1} (${typeLabel})</span>${ib}${fmt}</div>

          <button class="btn btn-ghost btn-xs" onclick="pickImageFor(${i})">📷 Ảnh câu</button>
          ${pdfBtn}

          <button class="btn btn-danger btn-xs" onclick="delQ(${i})">🗑</button>
        </div>
      </div>
      <div class="q-original">${esc(q._raw?.stemText||q.question)}</div>
      <div class="lbl">Câu hỏi</div>
      <textarea class="inp" oninput="setQ(${i},this.value)" style="min-height:60px;font-family:var(--serif);line-height:1.55">${esc(q.question)}</textarea>
      ${hasFmt(q.question)?`<div class="opt-preview"><span class="opt-preview-label">Preview</span><span class="rich-text">${richText(q.question)}</span></div>`:''}
      ${stemImg}${body}${issHTML}
    </div>`;
}

function clearOptImage(i,oi){const q=ST.questions[i];if(!q||!q.optImages)return;q.optImages[oi]='';markDirty();refreshUI();}
function pickSubImage(i,si){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const url=await blobToDataURL(f);const q=ST.questions[i];if(!q)return;if(!q.subQuestions)q.subQuestions=[];if(!q.subQuestions[si])q.subQuestions[si]={text:'',image:''};q.subQuestions[si].image=url;markDirty();refreshUI();toast('✅ Ảnh ý '+(si+1),'ok');};inp.click();}
function clearSubImage(i,si){const q=ST.questions[i];if(!q||!q.subQuestions||!q.subQuestions[si])return;q.subQuestions[si].image='';markDirty();refreshUI();}

      ${all.map(img=>`<div style="position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1.5px solid var(--border);cursor:pointer;background:#0a0e1a" onclick="applyPdfImage(${qIdx},this.querySelector('img').src)"><img src="${img.dataUrl}" style="width:100%;height:100%;object-fit:contain"><div style="position:absolute;bottom:0;left:0;right:0;padding:2px 5px;background:rgba(0,0,0,.75);font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(img.file)} · tr.${img.page}</div></div>`).join('')}
    </div>

/* ═══ Type conversion ═══ */
function openTypeMenu(i,ev){
  ev.stopPropagation();
  $$('.type-menu').forEach(m=>m.remove());
  const q=ST.questions[i];if(!q)return;
  const r=ev.currentTarget.getBoundingClientRect();
  const m=document.createElement('div');m.className='type-menu';
  m.style.left=Math.min(r.left,window.innerWidth-190)+'px';
  m.style.top=(r.bottom+4)+'px';
  const cur=q.type;
  const types=[{t:'mcq',label:'🔘 ABCD'},{t:'tf',label:'✅ Đúng/Sai'},{t:'tnl',label:'✏️ Trả lời ngắn'},{t:'tl',label:'📖 Tự luận'}];
  const sc=q._typeScores||{mcq:0,tf:0,tnl:0,tl:0};
  const suggest=Object.keys(sc).reduce((a,b)=>sc[a]>sc[b]?a:b);
  m.innerHTML=types.map(x=>`<button data-t="${x.t}" class="${x.t===cur?'current':''}" ${x.t===cur?'disabled':''}>${x.label}${x.t===suggest&&x.t!==cur?' ⭐':''}</button>`).join('')+`<div class="hint">Gợi ý: <b>${suggest==='mcq'?'ABCD':suggest==='tf'?'Đúng/Sai':suggest==='tnl'?'TLN':'TL'}</b></div>`;
  document.body.appendChild(m);
  m.querySelectorAll('button[data-t]').forEach(b=>{if(b.disabled)return;b.onclick=()=>{m.remove();convertType(i,b.dataset.t);};});
  setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),10);
}
function convertType(i,newT){
  const q=ST.questions[i];if(!q)return;
  const oldT=q.type;
  if(!q._stash)q._stash={};
  if(!q._stash[oldT])q._stash[oldT]=JSON.parse(JSON.stringify({type:q.type,options:q.options,answer:q.answer,subQuestions:q.subQuestions,subAnswers:q.subAnswers,answerAlt:q.answerAlt,optImages:q.optImages,hint:q.hint}));
  const raw=q._raw||{};
  let b=null;
  if(newT==='mcq')b=buildMCQ(raw);
  else if(newT==='tf')b=buildTF(raw);
  else if(newT==='tnl')b=buildTNL(raw);
  else b=buildTL(raw);
  let preservedOptImages=null;
  if(newT==='mcq'&&oldT==='tf'&&q.subQuestions&&!q.optImages)preservedOptImages=q.subQuestions.map(sq=>sq.image||'');
  if(b&&b.ok&&b.type===newT){
    q.type=newT;
    if(newT==='mcq'){q.options=b.options;q.answer=b.answer;const oi=q.optImages||preservedOptImages;q.optImages=(b.options||[]).map((_,i)=>(oi&&oi[i])||'');delete q.subQuestions;delete q.subAnswers;delete q.answerAlt;}
    else if(newT==='tf'){const oi=q.optImages||[];q.subQuestions=b.subQuestions.map((sq,i)=>({text:sq.text,image:oi[i]||sq.image||''}));q.subAnswers=b.subAnswers;q.options=['Đúng','Sai'];delete q.answerAlt;delete q.optImages;}
    else if(newT==='tnl'){q.answer=b.answer;q.answerAlt=b.answerAlt;delete q.options;delete q.subQuestions;delete q.subAnswers;delete q.optImages;}
    else if(newT==='tl'){q.answer=b.answer;delete q.options;delete q.answerAlt;delete q.subQuestions;delete q.subAnswers;delete q.optImages;}
    if(!q._stash[newT])delete q._stash[oldT];
    q._issues=validate(q);markDirty();refreshUI();toast('🔁 → '+labelType(newT),'ok');return;
  }
  const old=JSON.parse(JSON.stringify({type:q.type,options:q.options,answer:q.answer,subQuestions:q.subQuestions,subAnswers:q.subAnswers,answerAlt:q.answerAlt,optImages:q.optImages,hint:q.hint}));
  q.type=newT;
  if(newT==='mcq'){q.options=(q.options&&q.options.length)?q.options:['','','',''];q.answer=typeof old.answer==='number'?old.answer:0;const oi=old.optImages||preservedOptImages||[];q.optImages=q.options.map((_,i)=>oi[i]||'');delete q.subQuestions;delete q.subAnswers;delete q.answerAlt;}
  else if(newT==='tf'){q.subQuestions=old.subQuestions||[{text:'',image:''},{text:'',image:''},{text:'',image:''},{text:'',image:''}];q.subAnswers=old.subAnswers||[null,null,null,null];q.options=['Đúng','Sai'];delete q.answerAlt;delete q.optImages;}
  else if(newT==='tnl'){q.answer=typeof old.answer==='number'?(old.options?.[old.answer]||''):(old.answer||'');q.answerAlt='';delete q.options;delete q.subQuestions;delete q.subAnswers;delete q.optImages;}
  else if(newT==='tl'){q.answer=old.hint||'';delete q.options;delete q.answerAlt;delete q.subQuestions;delete q.subAnswers;delete q.optImages;}
  q._stash[old.type]=old;
  q._issues=validate(q);markDirty();refreshUI();toast('🔁 → '+labelType(newT)+' (thủ công)','ok');
}
function labelType(t){return t==='mcq'?'ABCD':t==='tf'?'Đúng/Sai':t==='tnl'?'TLN':'TL';}
function openPreviewModal(i){
  const q=ST.questions[i];if(!q)return;
  let body='';
  if(q.type==='mcq'){
    body=(q.options||[]).map((o,oi)=>{const img=q.optImages&&q.optImages[oi];return `<div style="padding:10px 12px;border-radius:10px;border:1.5px solid ${oi===q.answer?'var(--emerald)':'var(--border)'};background:${oi===q.answer?'rgba(16,185,129,.12)':'rgba(255,255,255,.03)'};display:flex;align-items:center;gap:9px;margin-bottom:5px;font-family:var(--serif)"><b style="min-width:24px">${String.fromCharCode(65+oi)}.</b><span class="rich-text" style="flex:1">${richText(o)}</span>${img?`<img src="${img}" style="max-width:70px;max-height:70px;object-fit:contain;border-radius:5px;border:1px solid var(--border)" onclick="openLightbox(this.src)">`:''}${oi===q.answer?'✓':''}</div>`;}).join('');
  } else if(q.type==='tf'){
    body=(q.subQuestions||[]).map((sq,si)=>{const a=q.subAnswers?q.subAnswers[si]:null;return `<div class="sub-q"><div class="sub-q-head"><span class="sub-q-num">${si+1}.</span><span class="rich-text" style="flex:1">${richText(sq.text||'')}</span></div>${sq.image?`<img src="${sq.image}" style="max-width:100%;max-height:100px;border-radius:6px;margin-bottom:6px" onclick="openLightbox(this.src)">`:''}<div class="sub-q-ans"><button class="sub-btn ${a===true?'on-t':''}" disabled>✓ Đúng</button><button class="sub-btn ${a===false?'on-f':''}" disabled>✗ Sai</button></div></div>`;}).join('');
  } else {
    body=`<div style="padding:10px;border-radius:8px;border:1px dashed var(--border);font-family:var(--serif);white-space:pre-wrap">${esc(q.answer||'')}${q.answerAlt?`<br><small style="color:var(--muted)">Chấp nhận: ${esc(q.answerAlt)}</small>`:''}</div>`;
  }
  const bg=document.createElement('div');bg.className='modal-bg';
  const m=document.createElement('div');m.className='modal';m.style.maxWidth='640px';
  m.innerHTML=`<h3>👁️ Preview — Câu ${i+1} (${labelType(q.type)})</h3><div style="padding:12px;border-radius:10px;border:1.5px solid var(--border);background:rgba(13,18,32,.5)"><div class="rich-text" style="font-size:15px;margin-bottom:12px">${richText(q.question)}</div>${q.image?`<img src="${q.image}" style="max-width:100%;max-height:200px;border-radius:8px;margin-bottom:12px" onclick="openLightbox(this.src)">`:''}${body}</div><div class="modal-actions"><button class="btn btn-violet btn-full" onclick="this.closest('.modal-bg').remove()">Đóng</button></div>`;
  bg.appendChild(m);document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
}

/* ═══ History ═══ */
function refreshHistCount(){const el=$('#hist-count');if(el)el.textContent=Hist.count();}
function saveToHistory(silent){
  if(!ST.questions.length){if(!silent)toast('Chưa có câu hỏi','err');return null;}
  const data=getData();
  const id=ST.currentSetId||uid();
  const ok=Hist.upsert({id,...data});
  if(!ok)toast('⚠️ Không lưu (đã bỏ ảnh)','warn',4000);
  else if(!silent)toast('💾 Đã lưu: '+data.name,'ok',3000);
  ST.currentSetId=id;ST.currentSetName=data.name;ST.isDirty=false;
  refreshHistCount();
  if(ST.activeTab==='history')renderHistory();
  return id;
}
function getData(){const name=($('#set-name').value||ST.currentSetName||'Bộ đề').trim();const timePerQ=Math.max(5,Math.min(300,+$('#set-time-mcq').value||20));const hints=Math.max(1,Math.min(20,+$('#set-hints').value||3));return {name,timePerQ,hints,questions:ST.questions.map(stripQ)};}
function stripQ(q,i){
  const b={id:i+1,type:q.type,question:q.question||'',hint:q.hint||''};
  if(q.image)b.image=q.image;
  if(q.type==='mcq'){b.options=(q.options||[]).map(o=>String(o||'').trim()).filter(o=>o.length>0);b.answer=Math.max(0,Math.min(typeof q.answer==='number'?q.answer:0,b.options.length-1));if(q.optImages)b.optImages=q.optImages;}
  else if(q.type==='tf'){b.subQuestions=q.subQuestions||[];b.subAnswers=q.subAnswers||[];b.options=q.options||['Đúng','Sai'];}
  else{b.answer=String(q.answer||'').trim();if(q.answerAlt)b.answerAlt=String(q.answerAlt).trim();}
  return b;
}
function loadFromHistory(id){
  const it=Hist.get(id);if(!it)return;
  ST.questions=JSON.parse(JSON.stringify(it.questions||[]));
  for(const q of ST.questions){q.id=ST.nextQid++;q._issues=validate(q);q._confidence=1;q._typeScores={mcq:1,tf:0,tnl:0,tl:0};}
  ST.currentSetId=it.id;ST.currentSetName=it.name||'Bộ đề';ST.isDirty=false;
  const n=$('#set-name');if(n)n.value=ST.currentSetName;
  const t=$('#set-time-mcq');if(t)t.value=it.timePerQ||20;
  const h=$('#set-hints');if(h)h.value=it.hints||3;
  refreshUI();switchTab('file');toast('📂 '+ST.currentSetName,'ok');
}
function deleteFromHistory(id){const it=Hist.get(id);if(!it)return;uiConfirm('Xoá "'+it.name+'"?',()=>{Hist.remove(id);if(ST.currentSetId===id){ST.currentSetId=null;}refreshHistCount();renderHistory();toast('🗑','ok');},{danger:true,okText:'Xoá'});}
function renameFromHistory(id){const it=Hist.get(id);if(!it)return;uiPrompt('Tên mới:',it.name,(v)=>{Hist.upsert({...it,name:v});if(ST.currentSetId===id){ST.currentSetName=v;const n=$('#set-name');if(n)n.value=v;}renderHistory();toast('✏️','ok');});}
function downloadFromHistory(id){const it=Hist.get(id);if(!it)return;const out={name:it.name,timePerQ:it.timePerQ||20,hints:it.hints||3,questions:(it.questions||[]).map(stripQ)};openDownloadModal(JSON.stringify(out,null,2),safeName(it.name));}
function confirmClearHistory(){uiConfirm('Xoá TẤT CẢ lịch sử?',()=>{Hist.clear();ST.currentSetId=null;refreshHistCount();renderHistory();toast('🗑','ok');},{danger:true,okText:'Xoá'});}
function exportAllHistory(){const list=Hist.list();if(!list.length){toast('Trống','err');return;}const out=list.map(i=>({name:i.name,timePerQ:i.timePerQ||20,hints:i.hints||3,questions:i.questions||[]}));openDownloadModal(JSON.stringify(out,null,2),'quizconv_all_'+new Date().toISOString().slice(0,10)+'.json');}
function renderHistory(){
  const box=$('#hist-container');if(!box)return;
  const list=Hist.list();
  if(!list.length){box.innerHTML='<div class="hist-empty"><div class="ico">📭</div><h3>Chưa có bộ đề nào</h3><p style="margin-top:6px;font-size:12px">Upload file hoặc dán văn bản, sau đó ấn 💾 Lưu.</p></div>';return;}
  box.innerHTML='<div class="hist-list">'+list.map(it=>{
    const cur=ST.currentSetId===it.id;
    const qs=it.questions||[];
    const c={mcq:0,tf:0,tnl:0,tl:0};
    qs.forEach(q=>c[q.type]=(c[q.type]||0)+1);
    return `<div class="hist-card ${cur?'current':''}" onclick="loadFromHistory('${it.id}')">
      <div class="hist-card-title">${esc(it.name||'Bộ đề')}</div>
      <div class="hist-card-meta"><span>📝 ${qs.length} câu</span>${c.mcq?`<span>🔘 ${c.mcq} ABCD</span>`:''}${c.tf?`<span>✅ ${c.tf} Đ/S</span>`:''}${c.tnl?`<span>✏️ ${c.tnl} TLN</span>`:''}${c.tl?`<span>📖 ${c.tl} TL</span>`:''}<span>⏱ ${it.timePerQ||20}s</span><span>🗓 ${fmtDate(it.updatedAt)}</span></div>
      <div class="hist-card-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-xs" onclick="renameFromHistory('${it.id}')">✏️ Đổi tên</button>
        <button class="btn btn-emerald btn-xs" onclick="downloadFromHistory('${it.id}')">⬇️ JSON</button>
        <button class="btn btn-danger btn-xs" onclick="deleteFromHistory('${it.id}')">🗑</button>
      </div>
    </div>`;
  }).join('')+'</div>';
}

/* ═══ Paste ═══ */
function parsePasted(){
  const txt=$('#paste-input').value.trim();
  if(!txt){toast('Chưa có nội dung','err');return;}
  const cleaned=cleanText(txt);
  const qs=parseAll(cleaned);
  if(!qs.length){toast('❌ Không tìm thấy câu hỏi','err',3500);return;}
  for(const q of qs){q._issues=validate(q);ST.questions.push(q);}
  if(!ST.currentSetId){ST.currentSetName='Bộ đề dán '+new Date().toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});const n=$('#set-name');if(n)n.value=ST.currentSetName;}
  refreshUI();toast('✅ '+qs.length+' câu','ok');
  setTimeout(()=>$('#preview-section')?.scrollIntoView({behavior:'smooth'}),150);
}

/* ═══ Export ═══ */
function safeName(n){return (n||'bode').replace(/[^\p{L}\p{N}\-_ ]+/gu,'_').replace(/\s+/g,'_').slice(0,60)+'.json';}
function exportJSON(){
  if(!ST.questions.length){toast('Chưa có câu hỏi','err');return;}
  const d=getData();
  const out={name:d.name,timePerQ:d.timePerQ,hints:d.hints,questions:d.questions.map(stripQ)};
  saveToHistory(true);
  const json=JSON.stringify(out,null,2);
  openDownloadModal(json,safeName(d.name));
}
function openDownloadModal(json,filename){
  const sizeKB=(new Blob([json]).size/1024).toFixed(1);
  const canFS=!!window.showSaveFilePicker;
  const bg=document.createElement('div');bg.className='modal-bg';
  const m=document.createElement('div');m.className='modal';
  const btnStyle='width:100%;text-align:left;padding:11px;margin-bottom:8px;border:1.5px solid var(--border);background:rgba(255,255,255,.02);border-radius:10px;color:var(--text);font-family:var(--font);cursor:pointer;font-size:13px';
  m.innerHTML=`<h3>💾 Tải JSON</h3><p><b style="color:#a78bfa">${esc(filename)}</b><br><span style="font-size:11px">${sizeKB} KB</span></p>
    ${canFS?`<button style="${btnStyle}" data-x="fs"><b>💾 Lưu file (Save As)</b><br><small style="color:var(--muted)">Chọn vị trí lưu</small></button>`:''}
    <button style="${btnStyle}" data-x="anchor"><b>⬇️ Tải xuống trực tiếp</b><br><small style="color:var(--muted)">Vào thư mục Downloads</small></button>
    <button style="${btnStyle}" data-x="copy"><b>📋 Copy JSON</b><br><small style="color:var(--muted)">Dán vào file .json bạn tự tạo</small></button>
    <div class="modal-actions"><button class="btn btn-ghost btn-full" onclick="this.closest('.modal-bg').remove()">Đóng</button></div>`;
  bg.appendChild(m);document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
  const f=$('[data-x="fs"]',m);
  if(f)f.onclick=async()=>{try{const h=await window.showSaveFilePicker({suggestedName:filename});const w=await h.createWritable();await w.write(json);await w.close();bg.remove();toast('✅ Đã lưu','ok');}catch(e){if(e.name!=='AbortError')toast('⚠️ '+e.message,'err');}};
  m.querySelector('[data-x="anchor"]').onclick=()=>{try{const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},6000);bg.remove();toast('✅ Đã tải','ok');}catch(e){toast('❌ '+e.message,'err');}};
  m.querySelector('[data-x="copy"]').onclick=async()=>{try{await navigator.clipboard.writeText(json);toast('✅ Copy','ok');}catch(e){try{const ta=document.createElement('textarea');ta.value=json;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('✅ Copy','ok');}catch(e2){toast('❌','err');}}};
}

/* ═══ INIT ═══ */
init();
</script>
