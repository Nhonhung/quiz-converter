<script>
/*CORE*/
const san=t=>String(t).replace(/[\u00a0\u200b\u200e\uFEFF]/g,' ').replace(/\*/g,'∗').replace(/_{2,}/g,'＿＿＿＿');
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎'},SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ'};

const nz=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();

function parseLines(L,o){

        else{q.type='tnl';q.answer=san(ans);q.options=[];}

    q._qEnd=0;{const ai=B.lines.findIndex(l=>/(?:Đáp án|Answer|Key)\s*[:：]/i.test(l.t));q._qEnd=ai<0?B.lines.length:ai;}

}
function check(q){
  const t=s=>typeof s==='string'&&s.trim().length>0;

  if(q.type==='tnl')return t(q.answer)?'':'Thiếu đáp án';
  if(q.type==='tf'&&q.subQuestions){if(!q.subQuestions.length||q.subAnswers.some(a=>typeof a!=='boolean'))return'Thiếu đáp án Đúng/Sai của ý con';return'';}

  if(!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)return'Chưa chọn đáp án đúng';

function clean(q,i){const o={};for(const k in q)if(k[0]!=='_'&&k!=='needImg'&&!(k==='image'&&!q.image))o[k]=q[k];o.id=i;
  if(o.type==='mcq'&&!o.hint)o.hint='';return o;}
/*ENDCORE*/

/* ---------- UI / file readers ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SETS=[],SRC=[],busy=false;const log=m=>$('#log').textContent=m;
async function shrink(url,max=900){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/i.width),c=document.createElement('canvas');c.width=Math.max(1,i.width*k);c.height=Math.max(1,i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85));};i.onerror=()=>r('');i.src=url;});}
async function readPdf(buf,name){
  if(!window.pdfjsLib)throw new Error('Không tải được thư viện pdf.js (kiểm tra mạng).');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf.slice(0),isEvalSupported:false}).promise,lines=[],cnt={};
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p),H=pg.view[3],tc=await pg.getTextContent(),its=tc.items.filter(i=>typeof i.str==='string'&&i.str!==''&&i.transform).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.height)||Math.abs(i.transform[3])||10}));

async function cropQ(q,cache){
  const L=q._lines.slice(0,q._qEnd).filter(l=>l.p===q._src.p);if(!L.length)return'';

async function readDocx(buf){

          const ext=tg.split('.').pop().toLowerCase().replace('jpg','jpeg'),u64=await f.async('base64'),s=await shrink('data:image/'+ext+';base64,'+u64);if(s)imgs.push(s);}}

    if(n.nodeName==='w:p')await para(n);
    else if(n.nodeName==='w:tbl'){for(const tr of n.getElementsByTagName('w:tr')){const st=lines.length;for(const tc of ln(tr,'w:tc'))for(const p of ln(tc,'w:p'))await para(p);
      const add=lines.splice(st);if(add.length){lines.push({t:add.map(x=>x.t).filter(Boolean).join(' | '),img:add.flatMap(x=>x.img||[]).length?add.flatMap(x=>x.img||[]):null});}}}
  }
  return{lines:lines.filter(l=>l.t||l.img),warn};
}
async function fromJson(txt,name){
  let d=JSON.parse(txt.replace(/^\uFEFF/,''));const arr=Array.isArray(d)?d:d&&Array.isArray(d.questions)?d.questions:[];
  const qs=arr.filter(q=>q&&String(q.question||'').trim()).map(q=>({...q,_w:[],_inc:true}));
  return{name:(d&&d.name)||name,qs,notes:[]};
}
async function convert(){
  if(busy)return;busy=true;SETS=[];$('#out').innerHTML='';
  const o={hm:$('#hm').value},im=$('#im').value;
  try{
    for(let n=0;n<SRC.length;n++){const f=SRC[n],base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');log(`Đang xử lý ${f.name} (${n+1}/${SRC.length})…`);
      try{
        const ext=f.name.split('.').pop().toLowerCase(),set={name:base,file:f.name,qs:[],notes:[]};
        if(ext==='json'){const r=await fromJson(await f.text(),base);Object.assign(set,r);}
        else{let lines,pdf=null;
          if(ext==='pdf'){const r=await readPdf(await f.arrayBuffer());if(r.scanned){set.notes.push(`PDF scan (không có lớp chữ, ${r.scanned} trang) – không thể đọc chữ vì không có OCR. Hãy dùng bản PDF/DOCX có chữ.`);SETS.push(set);continue;}lines=r.lines;pdf=r.pdf;}
          else if(ext==='docx'){const r=await readDocx(await f.arrayBuffer());lines=r.lines;set.notes.push(...r.warn);}
          else if(ext==='doc'){throw new Error('Định dạng .doc cũ chưa hỗ trợ – hãy lưu lại thành .docx');}
          else lines=(await f.text()).split(/\r?\n/).map(t=>({t:san(t).trim()})).filter(l=>l.t);
          const r=parseLines(lines,o);set.qs=r.qs;if(r.ign)set.notes.push(`${r.ign} dòng nằm ngoài các câu hỏi (tiêu đề, phần tự luận, bài đọc…) đã được bỏ qua.`);
          if(!set.qs.length)set.notes.push('Không tìm thấy câu hỏi. File cần có dạng “Câu 1: … A. … B. … Đáp án: …”.');
          if(pdf){const cache=new Map();let k=0;for(const q of set.qs){
            const bad=!!check(q),need=im==='always'||(im==='auto'&&(q.needImg||bad||IMGRE.test(q.question+' '+q.options.join(' '))));
            if(need&&q._src){try{const u=await cropQ(q,cache);if(u){q.image=u;k++;}}catch(e){q._w.push('Không chụp được ảnh: '+e.message);}}
            if(!(k%5))log(`Đang chụp ảnh câu hỏi… (${k})`);}
            set._pdf=true;if(k)set.notes.push(`Đã chụp ${k} ảnh câu hỏi.`);}}
        SETS.push(set);
      }catch(e){SETS.push({name:base,file:f.name,qs:[],notes:['❌ Lỗi: '+e.message]});}
    }
    if($('#mg').value==='one'&&SETS.length>1){const all={name:'Bộ đề gộp',file:'(gộp)',qs:SETS.flatMap(s=>s.qs),notes:SETS.flatMap(s=>s.notes)};SETS=[all];}
    log('Xong.');
  }finally{busy=false;}
  render();
}
/* ---------- render ---------- */
function stat(s){let ok=0,bad=0;s.qs.forEach(q=>{if(q._inc){check(q)?bad++:ok++;}});return{ok,bad};}
function render(){
  $('#out').innerHTML=SETS.map((s,si)=>{const st=stat(s);return`<div class="c" data-s="${si}"><div class="row"><div style="flex:1;min-width:200px"><label class="l">Tên bộ đề · ${esc(s.file)}</label><input data-f="sname" value="${esc(s.name)}"></div>
  <div><b style="color:var(--ok)">${st.ok}</b> hợp lệ · <b style="color:${st.bad?'var(--er)':'var(--mu)'}">${st.bad}</b> lỗi</div>
  <button class="ok" data-a="dl" ${st.ok?'':'disabled'}>📥 Tải JSON</button></div>
  ${s.notes.map(n=>`<div class="w">⚠ ${esc(n)}</div>`).join('')}
  <details ${s.qs.length<=60?'open':''}><summary>${s.qs.length} câu hỏi</summary>${s.qs.map((q,qi)=>qh(q,qi)).join('')}</details></div>`;}).join('')+
  (SETS.length>1?'<div class="c"><button class="ok" data-a="zip">📦 Tải tất cả (.zip)</button></div>':'');
}
function qh(q,qi){
  const e=q._inc?check(q):'',D=` data-q="${qi}"`;let b='';
  if(q.type==='tnl')b=`<label class="l">Đáp án</label><input${D} data-f="answer" value="${esc(q.answer)}"><label class="l">Đáp án thay thế</label><input${D} data-f="answerAlt" value="${esc(q.answerAlt||'')}">`;
  else if(q.subQuestions)b=q.subQuestions.map((x,i)=>`<div class="opt"><span>${'abcd'[i]})</span>${esc(x.text)} → <b>${q.subAnswers[i]===true?'Đúng':q.subAnswers[i]===false?'Sai':'?'}</b></div>`).join('');
  else b=q.options.map((o,i)=>`<div class="opt"><input type="radio" name="r${qi}_${esc(q._num)}" ${q.answer===i?'checked':''}${D} data-f="ans" data-o="${i}"><span>${String.fromCharCode(65+i)}</span><input${D} data-f="opt" data-o="${i}" value="${esc(o)}"></div>`).join('');
  return`<div class="q ${e?'bad':''}"><div class="row"><input type="checkbox" ${q._inc?'checked':''}${D} data-f="inc"><b>Câu ${esc(q._num)}</b><span class="tag">${q.type==='tnl'?'Trả lời ngắn':q.subQuestions?'Đ/S nhiều ý':q.type==='tf'?'Đ/S':'ABCD'}</span>
  <select${D} data-f="type" style="width:auto"><option value="mcq" ${q.type==='mcq'?'selected':''}>ABCD</option><option value="tf" ${q.type==='tf'&&!q.subQuestions?'selected':''}>Đ/S</option><option value="tnl" ${q.type==='tnl'?'selected':''}>TNL</option></select></div>
  <textarea${D} data-f="question" rows="2">${esc(q.question)}</textarea>${q.image?`<img class="t" src="${q.image}">`:''}${b}
  <input${D} data-f="hint" placeholder="💡 Gợi ý" value="${esc(q.hint||'')}" style="margin-top:5px">
  <div class="row" style="margin-top:5px">${q._src?`<button class="g2" ${D} data-a="cam">${q.image?'🗑 Bỏ ảnh':'📷 Chụp ảnh câu hỏi'}</button>`:q.image?`<button class="g2"${D} data-a="rmimg">🗑 Bỏ ảnh</button>`:''}<label class="b g2">🖼 Tải ảnh lên<input type="file" accept="image/*" hidden${D} data-f="upimg"></label></div>
  ${q._w.map(w=>`<div class="w">⚠ ${esc(w)}</div>`).join('')}${e?`<div class="e">✖ ${esc(e)} – sửa hoặc bỏ tick để loại khỏi file</div>`:''}</div>`;
}
const out=$('#out');
function target(el){const s=el.closest('[data-s]');if(!s)return{};const si=+s.dataset.s,qi=el.dataset.q!=null?+el.dataset.q:null;return{si,s:SETS[si],qi,q:qi!=null?SETS[si].qs[qi]:null};}
out.addEventListener('input',e=>{const el=e.target,{s,q}=target(el),f=el.dataset.f;if(f==='sname'){s.name=el.value;return;}if(!q)return;
  if(f==='question')q.question=el.value;else if(f==='hint')q.hint=el.value;else if(f==='answer')q.answer=el.value;else if(f==='answerAlt')q.answerAlt=el.value;else if(f==='opt')q.options[+el.dataset.o]=el.value;});
out.addEventListener('change',async e=>{const el=e.target,{si,s,q}=target(el),f=el.dataset.f;if(!q)return;
  if(f==='inc'){q._inc=el.checked;}
  else if(f==='ans'){q.answer=+el.dataset.o;}
  else if(f==='type'){const t=el.value;if(t==='tnl'){q.type='tnl';q.options=[];q.answer=typeof q.answer==='string'?q.answer:(q.options&&q.options[q.answer])||'';delete q.subQuestions;delete q.subAnswers;}
    else{if(q.type==='tnl'||q.subQuestions){q.options=t==='tf'?['Đúng','Sai']:['','','',''];q.answer=0;delete q.subQuestions;delete q.subAnswers;}q.type=t;}}
  else if(f==='upimg'&&el.files[0]){const r=new FileReader();r.onload=async()=>{const u=await shrink(r.result);if(u){q.image=u;render();}};r.readAsDataURL(el.files[0]);return;}
  else return;render();});
out.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const{si,s,q}=target(b),a=b.dataset.a;
  if(a==='dl'){dl(s);}else if(a==='zip'){zipAll();}else if(a==='rmimg'){delete q.image;render();}
  else if(a==='cam'){if(q.image){delete q.image;render();return;}b.disabled=true;b.textContent='Đang chụp…';try{const u=await cropQ(q,new Map());if(u)q.image=u;else q._w.push('Không chụp được ảnh');}catch(x){q._w.push('Lỗi chụp ảnh: '+x.message);}render();}});
function payload(s){const qs=s.qs.filter(q=>q._inc&&!check(q)).map((q,i)=>clean(q,i+1));return{name:(s.name||'Bộ đề').trim()||'Bộ đề',timePerQ:Math.min(300,Math.max(5,+$('#tpq').value||20)),hints:Math.max(0,+$('#hn').value||0)||(+$('#hn').value===0?0:3),questions:qs};}
const fname=s=>(s||'bode').replace(/[\\/:*?"<>|\s]+/g,'_')+'.json';
function dl(s){const p=payload(s);if(!p.questions.length){alert('Không có câu hợp lệ để xuất.');return;}const js=JSON.stringify(p,null,2);
  if(js.length>3.5e6&&!confirm('File '+(js.length/1e6).toFixed(1)+' MB (nhiều ảnh) – có thể vượt dung lượng lưu của trình duyệt khi nạp vào game. Vẫn tải?'))return;
  save(new Blob([js],{type:'application/json'}),fname(p.name));}
function save(bl,n){const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
async function zipAll(){const z=new JSZip(),used=new Set();SETS.forEach(s=>{const p=payload(s);if(!p.questions.length)return;let n=fname(p.name),k=1;while(used.has(n))n=fname(p.name+'_'+(++k));used.add(n);z.file(n,JSON.stringify(p,null,2));});
  if(!used.size){alert('Không có câu hợp lệ.');return;}save(await z.generateAsync({type:'blob'}),'quiz_json.zip');}
/* ---------- input wiring ---------- */
const dz=$('#dz'),fi=$('#fi');
const take=fs=>{SRC=[...fs].filter(f=>/\.(pdf|docx|doc|txt|md|json)$/i.test(f.name));if(!SRC.length){log('Chỉ nhận .pdf, .docx, .txt, .md, .json');return;}convert();};
dz.onclick=()=>fi.click();fi.onchange=()=>{take(fi.files);fi.value='';};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on');};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');take(e.dataTransfer.files);};
$('#pb').onclick=()=>{const t=$('#paste').value;if(!t.trim())return;SRC=[new File([t],'Văn bản dán.txt')];convert();};
$('#rb').onclick=()=>{if(SRC.length)convert();};
</script></body></html>
